name: bikejee_app
description: BikeJee - Ride Fast, Deliver Smart.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.2.7

  # State Management
  provider: ^6.1.2

  # UI Components
  flutter_rating_bar: ^4.0.1
  dotted_border: ^2.1.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.4.1

  # Maps (placeholder - real impl needs API key)
  # google_maps_flutter: ^2.9.0

  # Utils
  intl: ^0.19.0
  percent_indicator: ^4.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
